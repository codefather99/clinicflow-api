spring.application.name=clinicflow-api
server.port=${PORT:8080}
clinicflow.version=0.1.0

# fake = Henry's in-memory ports. Flip to real at handshake H2 once Deji's implementations are merged.
clinicflow.ports=fake
# Days the clinic is closed. Set to empty (clinicflow.closed-days=) to rehearse on a Sunday.
clinicflow.closed-days=SUNDAY

# Local Postgres via docker-compose, or a Neon database through environment variables.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/clinicflow}
spring.datasource.username=${DB_USER:clinicflow}
spring.datasource.password=${DB_PASSWORD:clinicflow}

# Deji uses V1-V99, Henry V100-V199, so the two streams may interleave.
spring.flyway.locations=classpath:db/migration
spring.flyway.out-of-order=true

# --- Auth. The default secret is for local development ONLY: set CLINICFLOW_JWT_SECRET in every deployed environment.
clinicflow.jwt.secret=${CLINICFLOW_JWT_SECRET:dev-only-secret-change-me-dev-only-secret}
clinicflow.jwt.ttl-minutes=60

# Origins allowed to call the API from a browser. Add Ehimare's deployed address via CLINICFLOW_CORS_ORIGINS (comma separated).
clinicflow.cors.allowed-origins=${CLINICFLOW_CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# DEMONSTRATION credentials (listed in the README, labelled as demo). Override in deployed environments if you wish.
clinicflow.demo.reception-password=${DEMO_RECEPTION_PASSWORD:Reception-Demo-1}
clinicflow.demo.admin-password=${DEMO_ADMIN_PASSWORD:Admin-Demo-1}

management.endpoints.web.exposure.include=health
